name: CI
on:
  pull_request: null
  push:
    branches:
    - main
  schedule:
  - cron: 17 3 * * *
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm ci
    - name: Lint
      run: npm run lint
  type-check:
    name: type-check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm ci
    - name: Type check
      run: npx tsc --noEmit
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm ci
    - name: Build
      run: npm run build
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm ci
    - name: Test
      run: npm test
  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    needs:
    - lint
    - type-check
    - build
    - test
    - shellcheck
    if: always()
    steps:
    - name: Fail if any required job did not succeed
      env:
        NEEDS: ${{ toJSON(needs) }}
      run: "echo \"$NEEDS\"\nbad=$(echo \"$NEEDS\" | jq -r 'to_entries[] | select(((.value.result\
        \ == \"success\")) | not) | .key')\nif [ -n \"$bad\" ]; then\n  echo \"::error::These\
        \ jobs did not succeed: $bad\"\n  exit 1\nfi\necho \"All required jobs succeeded.\"\
        \n"
  docker-image:
    name: docker-image
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build the pinned stellar-sandbox image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        load: true
        tags: stellar-sandbox:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Assert the Rust pin matches rust-toolchain.toml
      run: 'dockerfile_version=$(grep -E ''^ARG RUST_VERSION='' Dockerfile | cut -d=
        -f2)

        toolchain_version=$(grep -E ''^channel[[:space:]]*='' rust-toolchain.toml
        | sed -E ''s/.*"([^"]+)".*/\1/'')

        echo "Dockerfile RUST_VERSION       = ${dockerfile_version}"

        echo "rust-toolchain.toml channel    = ${toolchain_version}"

        test "${dockerfile_version}" = "${toolchain_version}"

        '
    - name: Print the resolved toolchain versions
      run: docker run --rm stellar-sandbox:ci sh -c 'rustc --version && stellar --version
        && rust-analyzer --version'
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' }}
  nightly-report:
    name: nightly-report
    runs-on: ubuntu-latest
    if: ${{ always() && github.event_name == 'schedule' && github.repository == 'sorobanide-studio/stellar-ide'
      }}
    needs:
    - lint
    - type-check
    - build
    - test
    - docker-image
    permissions:
      contents: read
      issues: write
    steps:
    - name: Open or update the single nightly tracking issue
      uses: actions/github-script@v7
      env:
        NEEDS: ${{ toJSON(needs) }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
          github.run_id }}
      with:
        script: "const label = \"nightly\";\nconst needs = JSON.parse(process.env.NEEDS);\n\
          const failed = Object.entries(needs)\n  .filter(([, job]) => job.result\
          \ !== \"success\")\n  .map(([name, job]) => `- \\`${name}\\`: ${job.result}`);\n\
          \nif (failed.length === 0) {\n  core.info(\"Nightly run is green; nothing\
          \ to track.\");\n  return;\n}\n\nconst body = [\n  \"The scheduled nightly\
          \ build failed.\",\n  \"\",\n  ...failed,\n  \"\",\n  `Run: ${process.env.RUN_URL}`,\n\
          ].join(\"\\n\");\n\nconst open = await github.rest.issues.listForRepo({\n\
          \  owner: context.repo.owner,\n  repo: context.repo.repo,\n  state: \"open\"\
          ,\n  labels: label,\n});\n\nif (open.data.length > 0) {\n  const issue =\
          \ open.data[0];\n  await github.rest.issues.createComment({\n    owner:\
          \ context.repo.owner,\n    repo: context.repo.repo,\n    issue_number: issue.number,\n\
          \    body,\n  });\n  core.info(`Updated the existing nightly tracking issue\
          \ #${issue.number}.`);\n} else {\n  const created = await github.rest.issues.create({\n\
          \    owner: context.repo.owner,\n    repo: context.repo.repo,\n    title:\
          \ \"[nightly] scheduled build failure\",\n    body,\n    labels: [label],\n\
          \  });\n  core.info(`Opened nightly tracking issue #${created.data.number}.`);\n\
          }\n"
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Detect Dockerfile and toolchain changes
      id: filter
      uses: dorny/paths-filter@v3
      with:
        filters: "docker:\n  - \"Dockerfile\"\n  - \"rust-toolchain.toml\"\n  - \"\
          .github/workflows/ci.yml\"\n"
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Ensure shellcheck is available
      run: "if ! command -v shellcheck >/dev/null 2>&1; then\n  sudo apt-get update\n\
        \  sudo apt-get install -y shellcheck\nfi\nshellcheck --version\n"
    - name: Lint the extracted shell fragments
      run: shellcheck --severity=warning scripts/*.sh
    - name: Lint the Dockerfile RUN commands
      run: "awk '\n  /^[[:space:]]*RUN([[:space:]]|$)/ {\n    sub(/^[[:space:]]*RUN[[:space:]]*/,\
        \ \"\")\n    printf \"%s\", $0\n    while ($0 ~ /\\\\$/) { getline; printf\
        \ \"\\n%s\", $0 }\n    print \"\"\n    next\n  }\n' Dockerfile > /tmp/dockerfile-runs.sh\n\
        echo \"--- Dockerfile RUN bodies extracted for shellcheck ---\"\ncat /tmp/dockerfile-runs.sh\n\
        shellcheck --severity=warning --shell=sh /tmp/dockerfile-runs.sh\n"
permissions:
  contents: read
