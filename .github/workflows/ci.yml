name: CI
on:
  pull_request: null
  push:
    branches:
    - main
  schedule:
  - cron: 17 3 * * *
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm ci
    - name: Lint
      run: npm run lint
    timeout-minutes: 10
  type-check:
    name: type-check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm ci
    - name: Type check
      run: npx tsc --noEmit
    timeout-minutes: 10
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm ci
    - name: Build
      run: npm run build
    needs: type-check
    timeout-minutes: 20
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm ci
    - name: Test
      run: npm test
    timeout-minutes: 20
  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    needs:
    - lint
    - type-check
    - build
    - test
    - audit
    if: always()
    steps:
    - name: Fail if any required job did not succeed
      env:
        NEEDS: ${{ toJSON(needs) }}
      run: "echo \"$NEEDS\"\nbad=$(echo \"$NEEDS\" | jq -r 'to_entries[] | select(((.value.result\
        \ == \"success\")) | not) | .key')\nif [ -n \"$bad\" ]; then\n  echo \"::error::These\
        \ jobs did not succeed: $bad\"\n  exit 1\nfi\necho \"All required jobs succeeded.\"\
        \n"
  docker-image:
    name: docker-image
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build stellar-sandbox:v1
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        load: true
        tags: stellar-sandbox:v1
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Verify the toolchain inside the image
      run: docker run --rm stellar-sandbox:v1 bash -lc "rustc --version && stellar
        --version && rust-analyzer --version"
    - name: Log in to GHCR
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Push stellar-sandbox:v1 to GHCR
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ghcr.io/${{ github.repository }}/stellar-sandbox:v1
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' }}
    permissions:
      contents: read
      packages: write
  nightly-report:
    name: nightly-report
    runs-on: ubuntu-latest
    if: ${{ always() && github.event_name == 'schedule' && github.repository == 'sorobanide-studio/stellar-ide'
      }}
    needs:
    - lint
    - type-check
    - build
    - test
    - docker-image
    permissions:
      contents: read
      issues: write
    steps:
    - name: Open or update the single nightly tracking issue
      uses: actions/github-script@v7
      env:
        NEEDS: ${{ toJSON(needs) }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
          github.run_id }}
      with:
        script: "const label = \"nightly\";\nconst needs = JSON.parse(process.env.NEEDS);\n\
          const failed = Object.entries(needs)\n  .filter(([, job]) => job.result\
          \ !== \"success\")\n  .map(([name, job]) => `- \\`${name}\\`: ${job.result}`);\n\
          \nif (failed.length === 0) {\n  core.info(\"Nightly run is green; nothing\
          \ to track.\");\n  return;\n}\n\nconst body = [\n  \"The scheduled nightly\
          \ build failed.\",\n  \"\",\n  ...failed,\n  \"\",\n  `Run: ${process.env.RUN_URL}`,\n\
          ].join(\"\\n\");\n\nconst open = await github.rest.issues.listForRepo({\n\
          \  owner: context.repo.owner,\n  repo: context.repo.repo,\n  state: \"open\"\
          ,\n  labels: label,\n});\n\nif (open.data.length > 0) {\n  const issue =\
          \ open.data[0];\n  await github.rest.issues.createComment({\n    owner:\
          \ context.repo.owner,\n    repo: context.repo.repo,\n    issue_number: issue.number,\n\
          \    body,\n  });\n  core.info(`Updated the existing nightly tracking issue\
          \ #${issue.number}.`);\n} else {\n  const created = await github.rest.issues.create({\n\
          \    owner: context.repo.owner,\n    repo: context.repo.repo,\n    title:\
          \ \"[nightly] scheduled build failure\",\n    body,\n    labels: [label],\n\
          \  });\n  core.info(`Opened nightly tracking issue #${created.data.number}.`);\n\
          }\n"
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Detect Dockerfile changes
      id: filter
      uses: dorny/paths-filter@v3
      with:
        filters: "docker:\n  - \"Dockerfile\"\n  - \"lib/docker/**\"\n  - \".github/workflows/ci.yml\"\
          \n"
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Ensure shellcheck is available
      run: "if ! command -v shellcheck >/dev/null 2>&1; then\n  sudo apt-get update\n\
        \  sudo apt-get install -y shellcheck\nfi\nshellcheck --version\n"
    - name: Lint the extracted shell fragments
      run: shellcheck --severity=warning scripts/*.sh
    - name: Lint the Dockerfile RUN commands
      run: "awk '\n  /^[[:space:]]*RUN([[:space:]]|$)/ {\n    sub(/^[[:space:]]*RUN[[:space:]]*/,\
        \ \"\")\n    printf \"%s\", $0\n    while ($0 ~ /\\\\$/) { getline; printf\
        \ \"\\n%s\", $0 }\n    print \"\"\n    next\n  }\n' Dockerfile > /tmp/dockerfile-runs.sh\n\
        echo \"--- Dockerfile RUN bodies extracted for shellcheck ---\"\ncat /tmp/dockerfile-runs.sh\n\
        shellcheck --severity=warning --shell=sh /tmp/dockerfile-runs.sh\n"
  lsp:
    name: lsp
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stellar-lsp-server
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm ci
    - name: Type check
      run: npm run type-check
    - name: Build
      run: npm run build
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install root dependencies
      run: npm ci
    - name: Audit root dependencies (high and critical fail)
      run: node .github/scripts/audit.mjs
    - name: Install stellar-lsp-server dependencies
      working-directory: stellar-lsp-server
      run: npm ci
    - name: Audit stellar-lsp-server dependencies (high and critical fail)
      working-directory: stellar-lsp-server
      run: node ../.github/scripts/audit.mjs
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout full history
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Scan the full commit history for secrets
      run: "docker run --rm \\\n  -v \"${{ github.workspace }}:/repo\" \\\n  -w /repo\
        \ \\\n  ghcr.io/gitleaks/gitleaks:v8.30.1 \\\n  detect --source=/repo --config=/repo/.gitleaks.toml\
        \ --redact --verbose --exit-code=1\n"
  pins:
    name: pins
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Fail if any action is not pinned to a full commit SHA
      run: "if grep -REn '^[[:space:]]*(-[[:space:]]*)?uses:[[:space:]]*[^[:space:]]+@[^[:space:]]+'\
        \ .github/workflows \\\n    | grep -vE '@[0-9a-f]{40}([[:space:]]|$)'; then\n\
        \  echo \"::error::Every 'uses:' reference must be pinned to a 40-character\
        \ commit SHA.\"\n  exit 1\nfi\necho \"All 'uses:' references are pinned to\
        \ a full commit SHA.\"\n"
permissions:
  contents: read
