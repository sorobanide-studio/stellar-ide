name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  type-check:
    name: type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test

  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect Dockerfile changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docker:
              - "Dockerfile"
              - "lib/docker/**"
              - ".github/workflows/ci.yml"

  docker-image:
    name: docker-image
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build stellar-sandbox:v1
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: stellar-sandbox:v1
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify the toolchain inside the image
        run: docker run --rm stellar-sandbox:v1 bash -lc "rustc --version && stellar --version && rust-analyzer --version"
      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push stellar-sandbox:v1 to GHCR
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/stellar-sandbox:v1

  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    needs: [lint, type-check, build, test, changes, docker-image]
    if: always()
    steps:
      - name: Fail if any required job did not succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select((((.value.result == "success") or (.key == "docker-image" and .value.result == "skipped"))) | not) | .key')
          if [ -n "$bad" ]; then
            echo "::error::These jobs did not succeed: $bad"
            exit 1
          fi
          echo "All required jobs succeeded."
