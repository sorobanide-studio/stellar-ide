name: CI
on:
  pull_request: null
  push:
    branches:
    - main
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm ci
    - name: Lint
      run: npm run lint
  type-check:
    name: type-check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm ci
    - name: Type check
      run: npx tsc --noEmit
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm ci
    - name: Build
      run: 'set -o pipefail

        npm run build 2>&1 | tee build.log

        '
    - name: Fail on new build warnings
      env:
        BUILD_WARNING_THRESHOLD: '5'
      run: "# Turbopack prints one \"encountered N warnings\" summary; some Next.js\n\
        # build modes also print a line per warning. Count both and take the\n# larger,\
        \ so the gate neither misses the summary nor double-counts a\n# warning that\
        \ appears in both places.\nsummary=$( (grep -Eo 'encountered [0-9]+ warnings?'\
        \ build.log || true) | (grep -Eo '[0-9]+' || true) | awk '{s+=$1} END{print\
        \ s+0}' )\nlabelled=$(grep -Eci '^[[:space:]]*(⚠|warn(ing)?[: ])' build.log\
        \ || true)\nwarnings=$(( summary > labelled ? summary : labelled ))\necho\
        \ \"next build emitted ${warnings} warning line(s); the budget is ${BUILD_WARNING_THRESHOLD}.\"\
        \nif [ \"$warnings\" -gt \"$BUILD_WARNING_THRESHOLD\" ]; then\n  echo \"::error::next\
        \ build emitted ${warnings} warning line(s), over the ${BUILD_WARNING_THRESHOLD}-warning\
        \ budget.\"\n  grep -Ein 'warn' build.log | head -20 || true\n  exit 1\nfi\n"
    - name: Upload the build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: next-build-log
        path: build.log
        if-no-files-found: ignore
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm ci
    - name: Test
      run: npm test
  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    needs:
    - lint
    - type-check
    - build
    - test
    if: always()
    steps:
    - name: Fail if any required job did not succeed
      env:
        NEEDS: ${{ toJSON(needs) }}
      run: "echo \"$NEEDS\"\nbad=$(echo \"$NEEDS\" | jq -r 'to_entries[] | select(((.value.result\
        \ == \"success\")) | not) | .key')\nif [ -n \"$bad\" ]; then\n  echo \"::error::These\
        \ jobs did not succeed: $bad\"\n  exit 1\nfi\necho \"All required jobs succeeded.\"\
        \n"
