name: CI
on:
  pull_request: null
  push:
    branches:
    - main
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm ci
    - name: Lint
      run: npm run lint
  type-check:
    name: type-check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm ci
    - name: Type check
      run: npm run type-check
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm ci
    - name: Build
      run: npm run build
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm ci
    - name: Test
      run: npm test
  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    needs:
    - lint
    - type-check
    - build
    - test
    if: always()
    steps:
    - name: Fail if any required job did not succeed
      env:
        NEEDS: ${{ toJSON(needs) }}
      run: "echo \"$NEEDS\"\nbad=$(echo \"$NEEDS\" | jq -r 'to_entries[] | select(((.value.result\
        \ == \"success\")) | not) | .key')\nif [ -n \"$bad\" ]; then\n  echo \"::error::These\
        \ jobs did not succeed: $bad\"\n  exit 1\nfi\necho \"All required jobs succeeded.\"\
        \n"
permissions:
  contents: read
