name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  type-check:
    name: type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test

  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect Dockerfile and toolchain changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docker:
              - "Dockerfile"
              - "rust-toolchain.toml"
              - ".github/workflows/ci.yml"

  docker-image:
    name: docker-image
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build the pinned stellar-sandbox image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: stellar-sandbox:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Assert the Rust pin matches rust-toolchain.toml
        run: |
          dockerfile_version=$(grep -E '^ARG RUST_VERSION=' Dockerfile | cut -d= -f2)
          toolchain_version=$(grep -E '^channel[[:space:]]*=' rust-toolchain.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Dockerfile RUST_VERSION       = ${dockerfile_version}"
          echo "rust-toolchain.toml channel    = ${toolchain_version}"
          test "${dockerfile_version}" = "${toolchain_version}"
      - name: Print the resolved toolchain versions
        run: docker run --rm stellar-sandbox:ci sh -c 'rustc --version && stellar --version && rust-analyzer --version'

  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    needs: [lint, type-check, build, test, changes, docker-image]
    if: always()
    steps:
      - name: Fail if any required job did not succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select((((.value.result == "success") or (.key == "docker-image" and .value.result == "skipped"))) | not) | .key')
          if [ -n "$bad" ]; then
            echo "::error::These jobs did not succeed: $bad"
            exit 1
          fi
          echo "All required jobs succeeded."
